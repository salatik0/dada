<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBE9DD">
<title>З днем народження!</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@600;700;900&display=swap" rel="stylesheet">
<style>
.bag-svg{display:block;overflow:visible}
.bag-svg *{transform-box:view-box}
.bag-svg .b-ft{transition:transform .12s ease-out}
.bag.l .b-ft{transform:scaleX(-1)}
.bags{position:absolute;left:0;right:0;bottom:0;height:132px;z-index:4;pointer-events:none}
.bag{position:absolute;left:0}
.bag-b{position:absolute;left:0;top:0;width:100%;height:100%}
.bag-svg .ex{transition:opacity .14s ease-out}
.bag-b svg{width:100%;height:100%}
.bag-sh{position:absolute;border-radius:50%;background:radial-gradient(closest-side,rgba(70,72,80,.42),rgba(70,72,80,.34) 55%,rgba(70,72,80,0));transform-origin:50% 50%}
.bag-fx{position:absolute;width:0;height:0}
.bag-pop{position:absolute;left:0;bottom:0;width:15px;height:15px;display:block}
.bag-pop svg{display:block;width:100%;height:100%;filter:drop-shadow(0 1px 1px rgba(0,0,0,.12))}
.chute{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
.chute svg{position:absolute;overflow:visible}
.mascot{position:absolute;left:0;top:0;width:147px;height:131.25px;z-index:0;pointer-events:none;transform-origin:36.1905% 91.2%}
.mascot.front{z-index:2}
.mascot .m-svg{display:block;width:100%;height:100%;overflow:visible}
.mascot .m-svg *{transform-box:view-box}
.mascot .m-lean,.mascot .m-rig{transform-origin:116.3px 262.7px}
.mascot .m-ground{transform-origin:116.3px 262.3px}
.mascot .m-body{transform-origin:122.5px 223.7px}
.mascot .m-legL{transform-origin:92.0px 223.0px}
.mascot .m-legR{transform-origin:140.7px 224.0px}
.mascot .m-arm{transform-origin:213.5px 163.8px;opacity:0}
.mascot .m-flower{transform-origin:253.5px 175.8px}
.mascot .m-bloom{transform-origin:262.4px 112.3px}
.mascot .m-eyeL{transform-origin:111.2px 121.7px}
.mascot .m-eyeR{transform-origin:142.0px 118.8px}
.mascot .m-legL path,.mascot .m-legR path{transition:opacity .12s}
.mascot.face-l .m-legL .r,.mascot.face-l .m-legR .r{opacity:0}
.mascot.face-l .m-legL .l,.mascot.face-l .m-legR .l{opacity:1}
:root{--bg1:#FFF5E8;--bg2:#FFE6EA;--ink:#2B2230;--red:#E3222B;--font:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:radial-gradient(120% 90% at 50% 0%,#FFF9F1 0,#FBE9DD 60%,#F3D9CF 100%);display:flex;align-items:center;justify-content:center;font-family:var(--font);color:var(--ink);overflow:hidden}
#wrap{--k:.4;--h:780;flex:none;width:calc(600px*var(--k));height:calc(var(--h)*var(--k)*1px);position:relative}
#stage{position:absolute;left:0;top:0;width:600px;height:calc(var(--h)*1px);transform:scale(var(--k));transform-origin:0 0;border-radius:28px;overflow:hidden;
  background:linear-gradient(180deg,var(--bg1) 0%,#FFF0EC 55%,var(--bg2) 100%);box-shadow:0 24px 60px rgba(120,60,50,.22),0 2px 6px rgba(120,60,50,.12)}
#floor{position:absolute;left:0;right:0;bottom:0;height:80px;background:linear-gradient(180deg,#F6D9CF 0,#EFCABE 100%)}
#floor::before{content:"";position:absolute;left:0;right:0;top:-1px;height:2px;background:#E7BBAE}
#floor::after{content:"";position:absolute;left:50%;top:-48px;width:520px;height:96px;margin-left:-260px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.55),rgba(255,255,255,0));pointer-events:none}
#garland{position:absolute;left:-10px;top:0;width:620px;height:120px;z-index:1}
.balloons{position:absolute;top:calc(96px + (var(--h) - 780)*.4px);z-index:1;animation:float 4.6s ease-in-out infinite}
.balloons.l{left:18px}
.balloons.r{right:14px;animation-delay:-2.1s}
.balloons svg{display:block;width:calc(96px + (var(--h) - 780)*.06px);height:auto}
@keyframes float{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-12px) rotate(2deg)}}
.grp{position:absolute;top:0;pointer-events:none;clip-path:inset(-2000px -2000px 0 -2000px)}
#g-back{left:24px;width:552px;bottom:calc(150px + (var(--h) - 780)*.04px);z-index:2}
#g-mid{left:-6.7px;width:613.3px;bottom:calc(204px + (var(--h) - 780)*.1px);z-index:1;transform:scale(.9);transform-origin:50% 100%}
#g-far{left:-45px;width:690px;bottom:calc(256px + (var(--h) - 780)*.16px);z-index:1;transform:scale(.8);transform-origin:50% 100%}
.back-floor,.mid-floor,.far-floor{position:absolute;left:24px;right:24px;height:4px;border-radius:2px;background:rgba(231,187,174,.55)}
.back-floor{bottom:calc(148px + (var(--h) - 780)*.04px)}
.mid-floor{bottom:calc(203px + (var(--h) - 780)*.1px);height:3px;background:rgba(231,187,174,.45)}
.far-floor{bottom:calc(255px + (var(--h) - 780)*.16px);height:3px;background:rgba(231,187,174,.35)}
#g-front{left:0;width:444.4px;bottom:78px;z-index:4;transform:scale(1.35);transform-origin:0 100%}
.grp .bags{bottom:-22px;height:150px;z-index:1}
#stage{z-index:1}
#hero{position:absolute;left:0;top:0;width:600px;height:calc(var(--h)*1px);transform:scale(var(--k));transform-origin:0 0;z-index:0;pointer-events:none}
#hero.front{z-index:2}
.good{position:absolute;left:0;top:0;z-index:6;pointer-events:none}
.good svg{display:block;width:100%;height:100%;overflow:visible}
.sign{position:absolute;z-index:7;pointer-events:none}
.sign.bang{font:900 46px/1 var(--font);color:var(--red);text-shadow:0 2px 0 #fff}
.sign.puff{border-radius:50%;background:#E4C6BC}
.sign.dizzy{width:0;height:0}
.sign.dizzy i{position:absolute;left:-10px;top:-10px;width:20px;height:20px;display:block}
.sign.dizzy svg{width:100%;height:100%}
.conf{position:absolute;top:0;z-index:8;pointer-events:none}
.cloud{position:absolute;left:50%;bottom:calc(100% + 4px);transform:translate(-50%,0);transform-origin:50% 100%;z-index:9;white-space:nowrap;text-align:center;
  padding:7px 11px 8px;border-radius:16px;background:#fff;color:var(--ink);font:700 12.5px/1.15 var(--font);box-shadow:0 4px 12px rgba(120,60,50,.18)}
.cloud::after{content:"";position:absolute;left:50%;bottom:-7px;width:14px;height:14px;margin-left:-7px;background:#fff;transform:rotate(45deg);border-radius:0 0 3px 0}
.cloud.hi{bottom:calc(100% + 40px)}
.cloud.hi::before{content:"";position:absolute;left:50%;bottom:-30px;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(120,60,50,.15)}
.cloud.small{font-size:14px;padding:6px 10px}
.cloud.hero{bottom:auto;transform-origin:20% 100%;font-size:16px;color:var(--red);padding:8px 14px}
#title{position:absolute;left:0;right:0;top:calc(215px + (var(--h) - 780)*.45px);z-index:3;transform:scale(min(1.12,calc(1 + (var(--h) - 780)*.0005)));transform-origin:50% 0;text-align:center;pointer-events:none}
#title .t{display:block;font:900 64px/1.02 var(--font);color:var(--red);letter-spacing:-.5px;text-shadow:0 3px 0 #fff,0 8px 18px rgba(227,34,43,.22)}
#title .t+.t{font-size:58px}
#title .ch{display:inline-block;white-space:pre}
#title .sub{display:inline-flex;align-items:center;gap:10px;margin-top:16px;font:600 18px/1 var(--font);color:#7A5560}
#title .sub svg{height:20px;width:auto}
#again{position:absolute;right:18px;bottom:18px;z-index:10;height:38px;padding:0 16px;border:0;border-radius:19px;background:#fff;color:var(--red);font:600 14px var(--font);box-shadow:0 4px 12px rgba(120,60,50,.18);cursor:pointer}
#again:focus-visible{outline:2px solid var(--red);outline-offset:2px}
[hidden]{display:none!important}
.canchor{position:absolute;width:0;height:0;z-index:8;pointer-events:none}
.canchor .cloud.hero{left:0;bottom:0}
/* small screens: bigger speech clouds and button */
.big-ui .cloud{font-size:17px;padding:9px 14px 10px;border-radius:20px}
.big-ui .cloud.small{font-size:18px;padding:8px 13px}
.big-ui .cloud.hero{font-size:22px;padding:10px 17px}
.big-ui #again{height:54px;padding:0 24px;border-radius:27px;font-size:20px;right:22px;bottom:22px}
/* tall screens: a few balloons drift up behind the title */
#sky{position:absolute;left:0;top:0;width:600px;height:calc(215px + (var(--h) - 780)*.45px);z-index:0;pointer-events:none;display:none;overflow:hidden;-webkit-mask-image:linear-gradient(to top,transparent 0,#000 90px);mask-image:linear-gradient(to top,transparent 0,#000 90px)}
.tall #sky{display:block}
#sky i{position:absolute;bottom:-90px;width:34px;animation:rise linear infinite;opacity:.8}
#sky svg{display:block;width:100%;height:auto;animation:sway 3.2s ease-in-out infinite alternate}
@keyframes rise{from{transform:translateY(0)}to{transform:translateY(calc(-215px - (var(--h) - 780)*.45px - 200px))}}
@keyframes sway{from{transform:translateX(-7px) rotate(-5deg)}to{transform:translateX(7px) rotate(5deg)}}
</style>

!function() {
  "use strict";
  const BG = {

    back: [ "Ура!", "Вітаємо!", "Зі святом!", "Ура-а!", "З днем<br>народження!" ],
    far: [ "Ура!", "Вітаємо!", "Ура-а!", "Зі святом!" ]
  };
  const HERO_SAY = [ "Це тобі!", "Це тобі!", "Зі святом!", "Ура!" ];
  const live = new Set;
  function stageXY(el) {
    const r = el.getBoundingClientRect(), sr = stage.getBoundingClientRect(), k = sr.width / W;
    return {
      x: (r.left + r.width / 2 - sr.left) / k,
      y: (r.top - sr.top) / k
    };
  }
  function box(c, x, y) {
    const w = c.offsetWidth, h = c.offsetHeight, ml = parseFloat(c.style.marginLeft) || 0, cls = c.classList, b = cls.contains("hero") ? y : y - 4;
    return {
      l: x + ml - w / 2,
      r: x + ml + w / 2,
      t: b - h - (cls.contains("hero") ? 0 : 8),
      b: b
    };
  }
  function hits(c) {
    const p = 8, r = c.__box;
    for (const o of live) {
      if (o === c) continue;
      const q = o.__box;
      if (r.l < q.r + p && r.r > q.l - p && r.t < q.b + p && r.b > q.t - p) return true;
    }
    const t = document.getElementById("title"), sr = stage.getBoundingClientRect(), k = sr.width / W;
    if (t && !t.hidden) {
      const q = t.getBoundingClientRect(), qb = (q.bottom - sr.top) / k;
      if (r.t < qb + p) return true;
    }
    return false;
  }
  function say(x, y, text, cls, life) {
    const an = document.createElement("div");
    an.className = "canchor";
    an.style.left = x.toFixed(1) + "px";
    an.style.top = y.toFixed(1) + "px";
    stage.appendChild(an);
    const c = cloud(an, text, cls, 0);
    c.__box = box(c, x, y);
    if (hits(c)) {
      an.remove();
      return null;
    }
    live.add(c);
    later(() => {
      c.animate([ {
        transform: "translate(-50%,0) scale(1)",
        opacity: 1
      }, {
        transform: "translate(-50%,0) scale(.3)",
        opacity: 0
      } ], {
        duration: 260,
        easing: "ease-in",
        fill: "forwards"
      }).finished.then(() => {
        live.delete(c);
        an.remove();
      });
    }, life);
    return c;
  }
  function bagSay(x, text) {
    const row = /front/.test(x.gr.g.id) ? "front" : /back|mid/.test(x.gr.g.id) ? "back" : "far";
    const t = text || SAY[row][Math.floor(Math.random() * SAY[row].length)], {x: px, y: y} = stageXY(x.b.el);
    const life = rand(1700, 2600), c = say(px, y + ("front" === row ? 6 : 2), t, "front" === row ? "" : "small", life);
    if (c) {
      x.until = performance.now() + rand(3e3, 5e3);
      doAct(x.b, Math.random() < .5 ? "hop" : "love", life);
    }
    return c;
  }
  function heroSay(text) {
    return say(feetX() + 70 * Q, FLOOR - 215 * Q + 38, text, "hero", rand(1800, 2600));
  }
  async function finale() {
    const bags = [];
    G.forEach(gr => gr.sc.bags.forEach(b => bags.push({
      b: b,
      gr: gr,
      until: 0
    })));
    await Promise.race([ Promise.all(bags.map(x => x.b.ready)), sleep(3e3) ]);
    for (let t = 0; t < 1200 && bags.some(x => "walk" === x.b.s.state); t += 100) await sleep(100);
    const by = id => bags.filter(x => x.gr.g.id === id);
    const FR0 = by("g-front"), L = FR0.filter(x => (x.b.s.x + x.b.w / 2) * FRONT_K < feetX()).sort((p, q) => q.b.s.x - p.b.s.x), Rr = FR0.filter(x => (x.b.s.x + x.b.w / 2) * FRONT_K >= feetX()).sort((p, q) => p.b.s.x - q.b.s.x);
    title();
    confetti();
    bags.forEach((x, i) => later(() => doAct(x.b, i % 2 ? "love" : "hop"), 55 * i));
    await sleep(55 * bags.length + 200);
    const first = [ L[1] || L[0], Rr[1] || Rr[0] ].filter(Boolean);
    first.forEach((x, i) => later(() => bagSay(x, "З днем<br>народження!"), 260 * i));
    later(() => heroSay("Це тобі!"), 700);
    const tick = () => {
      if (live.size < 4) {
        const now = performance.now();
        if (Math.random() < .14 && ![ ...live ].some(c => c.classList.contains("hero"))) heroSay(HERO_SAY[Math.floor(Math.random() * HERO_SAY.length)]); else for (let k = 0; k < 6; k++) {
          const x = bags[Math.floor(Math.random() * bags.length)];
          if (x.until > now || "idle" !== x.b.s.state || x.b.s.air) continue;
          if (bagSay(x)) break;
        }
      }
      if (Math.random() < .35) {
        const x = bags[Math.floor(Math.random() * bags.length)];
        doAct(x.b, [ "hop", "love", "wink", "cool", "wave", "hum" ][Math.floor(6 * Math.random())]);
      }
      later(tick, rand(380, 700));
    };
    later(tick, 1300);
    document.getElementById("again").hidden = false;
  }
  let running = false;
  async function play() {
    if (running) return;
    running = true;
    document.getElementById("again").hidden = true;
    document.getElementById("title").hidden = true;
    loops.forEach(clearTimeout);
    loops = [];
    live.clear();
    stage.querySelectorAll(".canchor,.cloud,.good,.sign,.conf").forEach(e => e.remove());
    const IDS = [ "g-far", "g-mid", "g-back", "g-front" ];
    IDS.forEach(id => {
      const g = document.getElementById(id);
      g.querySelectorAll(".bags").forEach(l => l.remove());
    });
    G = IDS.map(group);
    follow(G[3].sc);
    G.forEach((g, i) => {
      if (3 !== i) spots(g.sc, false);
    });
    makeHero();
    const row = i => [ "far", "back", "back", "front" ][i];
    const plan = [];
    const add = (gi, n, from, to) => {
      for (let k = 0; k < n; k++) plan.push([ gi, from + (to - from) * (k + .6 * Math.random()) / n ]);
    };
    add(0, 10, 300, 9400);
    add(1, 11, 400, 9800);
    add(2, 11, 200, 1e4);
    add(3, 6, 1200, 10400);
    plan.sort((a, b) => a[1] - b[1]);
    let prev = -1e9, lastChute = -1e9;
    plan.forEach(e => {
      e[1] = Math.max(e[1], prev + rand(170, 300));
      prev = e[1];
      const r = row(e[0]), opts = ENTR[r];
      let kind = opts[Math.floor(Math.random() * opts.length)];
      if ("chute" === kind && e[1] - lastChute < 1700) kind = opts.find(k => "chute" !== k);
      if ("chute" === kind) lastChute = e[1];
      e.push(kind);
    });
    plan.forEach(([gi]) => G[gi].sc.total = (G[gi].sc.total || 0) + 1);
    plan.forEach(([gi, t, kind]) => setTimeout(() => addBag(G[gi], Math.random() < .5 ? "full" : "empty", kind), t));
    await comeOut();
    await walkTo(100);
    await tumble();
    SPEED = .27;
    await flowerShow();
    await finale();
    running = false;
  }
  let t0 = performance.now();
  document.getElementById("again").addEventListener("click", () => {
    t0 = performance.now();
    play();
  });
  play().catch(e => {
    console.error("PLAY", e && e.stack || e);
  });
}();
</script>
</body>
</html>
